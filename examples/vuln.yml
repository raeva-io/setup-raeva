# .github/workflows/raeva-vuln.yml: scan raeva.lock against OSV and upload
# the findings to code scanning.
name: Vulnerabilities

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  vuln:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: raeva-io/setup-raeva@v1.0.0
        with:
          version: 0.5.0
          check: true
          vuln: true
          vuln-fail-on: high
          # A scheduled run starts from an empty store and metadata cache, so
          # it also sees a POM that was republished upstream.
          cache: ${{ github.event_name != 'schedule' }}
