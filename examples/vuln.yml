# .github/workflows/raeva-vuln.yml: scan raeva.lock against OSV, list the
# findings in the job summary, and upload them to code scanning.
#
# Pull requests fail only on findings new against the base commit's lock.
# Pushes to main and the weekly run fail on all findings at high or above.
name: Vulnerabilities

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  vuln:
    runs-on: ubuntu-latest
    permissions:
      # upload-sarif reads the workflow run; a private repository refuses
      # that without actions: read. A private repository without GitHub
      # Code Security refuses the upload: set sarif-upload: false there, or
      # the action skips it with a notice.
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21" # a JDK listed in [lock] jdks, or the JDK the lock was written with
      - uses: raeva-io/setup-raeva@v1.0.0
        with:
          version: 0.5.0
          vuln: true
          vuln-fail-on: high
          # A scheduled run starts from an empty store and metadata cache, so
          # it also sees a POM that was republished upstream.
          cache: ${{ github.event_name != 'schedule' }}
