name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RAEVA_VERSION: 0.5.0

jobs:
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup
        uses: ./
        with:
          version: ${{ env.RAEVA_VERSION }}
          verify: attestation
          working-directory: test/fixture

      - name: raeva is on PATH and rv is not
        shell: bash
        env:
          RAEVA: ${{ steps.setup.outputs.raeva }}
        run: |
          raeva --version
          test -x "$RAEVA"
          if command -v rv >/dev/null 2>&1 && [ "$(command -v rv)" -ef "$RAEVA" ]; then
            echo "rv must not be installed without rv-alias"; exit 1
          fi

      - name: Lock the fixture for this runner
        shell: bash
        run: raeva -C test/fixture sync

      - id: check
        uses: ./
        with:
          version: ${{ env.RAEVA_VERSION }}
          verify: sha256
          working-directory: test/fixture
          check: true
          vuln: true
          vuln-fail-on: never
          sarif-upload: false

      - name: The frozen check passed
        shell: bash
        env:
          FROZEN_EXIT_CODE: ${{ steps.check.outputs.frozen-exit-code }}
        run: test "$FROZEN_EXIT_CODE" = 0

      - name: Bump the fixture POM
        shell: bash
        run: sed -i.bak 's|<version>2.13.2</version>|<version>2.13.1</version>|' test/fixture/pom.xml

      - id: stale
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.RAEVA_VERSION }}
          verify: sha256
          working-directory: test/fixture
          cache: false
          check: true

      - name: The frozen check failed on the stale lock
        shell: bash
        env:
          OUTCOME: ${{ steps.stale.outcome }}
          FROZEN_EXIT_CODE: ${{ steps.stale.outputs.frozen-exit-code }}
        run: |
          test "$OUTCOME" = failure
          test "$FROZEN_EXIT_CODE" = 7
          set +e
          raeva -C test/fixture sync --frozen
          code=$?
          set -e
          test "$code" -eq 7

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup
        uses: ./
        with:
          version: ${{ env.RAEVA_VERSION }}
          cache: false

      - name: shellcheck
        run: shellcheck scripts/*.sh test/*.sh

      - name: Lock the test projects
        run: |
          cp -r test/fixture "$RUNNER_TEMP/project"
          cp -r test/vuln-fixture "$RUNNER_TEMP/vuln-project"
          raeva -q -C "$RUNNER_TEMP/project" sync --platforms linux-x86_64,macos-aarch64,windows-x86_64
          raeva -q -C "$RUNNER_TEMP/vuln-project" sync

      - name: test/local.sh (bash and pwsh)
        env:
          RAEVA_BUILD: ${{ steps.setup.outputs.raeva }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PROJECT="$RUNNER_TEMP/project" VULN_PROJECT="$RUNNER_TEMP/vuln-project" \
            PWSH="$(command -v pwsh)" RELEASE_VERSION="$RAEVA_VERSION" bash test/local.sh

      - name: test/relock.sh
        env:
          RAEVA_BUILD: ${{ steps.setup.outputs.raeva }}
        run: PROJECT="$RUNNER_TEMP/project" bash test/relock.sh
