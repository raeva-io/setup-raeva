# .github/workflows/raeva-relock.yml: write raeva.lock again on Dependabot
# and Renovate pull requests that change a POM, and push it to the PR branch.
#
# The relock job runs raeva with a read-only token. The push job has write
# access but runs no raeva and no project code: it copies the lock from the
# relock job's artifact, after checking that the artifact holds nothing else.
name: Relock

on:
  pull_request:
    paths:
      - "**/pom.xml"
      - ".mvn/maven.config"
      - "raeva.toml"

permissions: {}

concurrency:
  group: raeva-relock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  relock:
    # Only a bot's own push to its own branch in this repository. A fork PR,
    # a PR opened by a person, and a push by anyone else to a bot branch are
    # all skipped.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.actor &&
      (github.actor == 'dependabot[bot]' || github.actor == 'renovate[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - id: raeva
        uses: raeva-io/setup-raeva@v1.0.0
        with:
          version: 0.5.0
          relock: true
      - id: diff
        env:
          LOCK: ${{ steps.raeva.outputs.lock-file }}
        run: |
          mkdir -p "$RUNNER_TEMP/relock"
          if git diff --quiet -- "$LOCK" .mvn/checksums; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --stat -- "$LOCK" .mvn/checksums
          mapfile -t checksums < <(git ls-files .mvn/checksums)
          tar -cf "$RUNNER_TEMP/relock/relock.tar" "$LOCK" "${checksums[@]}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raeva-relock
          path: ${{ runner.temp }}/relock/relock.tar
          retention-days: 1

  push:
    needs: relock
    if: needs.relock.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Optional. A push with the default token does not start CI on the new
      # commit without approval; a GitHub App token does. Store the App ID as
      # the variable RELOCK_APP_ID and its key as the secret
      # RELOCK_APP_PRIVATE_KEY (a Dependabot secret for Dependabot PRs).
      - id: app
        if: vars.RELOCK_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELOCK_APP_ID }}
          private-key: ${{ secrets.RELOCK_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: raeva-relock
          path: ${{ runner.temp }}/relock
      - name: Commit and push the lock
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/relock/relock.tar"
          # The artifact was written by a job that processed network data.
          # Accept only the lock and the Trusted Checksums files.
          allowed='^(raeva\.lock|rv\.lock|\.mvn/checksums/checksums\.sha(256|1))$'
          while IFS= read -r name; do
            [[ "$name" =~ $allowed ]] || { echo "::error::unexpected file in artifact: $name"; exit 1; }
          done < <(tar -tf "$archive")
          mapfile -t files < <(tar -tf "$archive")
          tar -xf "$archive" --no-same-owner --no-same-permissions
          for name in "${files[@]}"; do
            [[ -f "$name" && ! -L "$name" ]] || { echo "::error::$name is not a regular file"; exit 1; }
          done
          git add -- "${files[@]}"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -m 'Update raeva.lock [dependabot skip]'
          auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)")
          if ! git "${auth[@]}" push --quiet origin "HEAD:refs/heads/$HEAD_REF"; then
            # A fast-forward push fails when the bot pushed again. That push
            # starts a new relock run, so this one stops without an error.
            if [[ "$(git "${auth[@]}" ls-remote origin "refs/heads/$HEAD_REF" | cut -f1)" != "$HEAD_SHA" ]]; then
              echo "::notice::$HEAD_REF moved since this run started; the newer run relocks it"
              exit 0
            fi
            exit 1
          fi
