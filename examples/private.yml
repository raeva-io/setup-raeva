# .github/workflows/ci.yml for a public repository whose build reads a
# private Maven repository. The store holds the private jars, and a pull
# request from a fork can restore any cache the default branch saved, so the
# job with credentials never saves one. Fork pull requests get no secrets;
# their job shows the lock diff and leaves the check to a maintainer.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  raeva:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Writes ~/.m2/settings.xml with a <server> for the repository id that
      # reads the credentials from these variables.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          server-id: company-releases
          server-username: REPO_USER
          server-password: REPO_TOKEN
      - uses: raeva-io/setup-raeva@v1.0.0
        env:
          REPO_USER: ${{ secrets.REPO_USER }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        with:
          version: 0.5.0
          check: true
          cache: false

  fork:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raeva-io/setup-raeva@v1.0.0
        with:
          version: 0.5.0
          cache: false
          lock-diff: only
