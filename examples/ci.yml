# .github/workflows/ci.yml: check raeva.lock, then build with Maven.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Set up the JDK first. raeva reads JAVA_HOME, and a lock whose POMs
      # test the JDK version passes --frozen only on a JDK with the same
      # outcome.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: raeva-io/setup-raeva@v1.0.0
        with:
          version: 0.5.0
          check: true

      - run: raeva export-m2
      - run: mvn --batch-mode verify
