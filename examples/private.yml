# .github/workflows/ci.yml for a public repository whose build reads a
# private Maven repository. The store holds the private jars, and a pull
# request from a fork can restore any cache the default branch saved, so the
# job with credentials never saves one. Fork pull requests get no secrets;
# their job shows the lock diff and leaves the check to a maintainer.
name: CI

on:
  push:
    branches: [main] # your default branch
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      REPO_USER: ${{ secrets.REPO_USER }}
      REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Writes $RUNNER_TEMP/settings.xml with a <server> for the
      # repository id that reads the credentials from REPO_USER and
      # REPO_TOKEN, and leaves ~/.m2/settings.xml as it is. With -s,
      # raeva and mvn use this file instead of ~/.m2/settings.xml. It
      # has no repositories, so declare the repository with the same id
      # in the POM, where mvn finds it too: one declared only in a
      # developer's ~/.m2/settings.xml is not seen here. Both ask Maven
      # Central last, so the private repository gets each public
      # artifact request first. For raeva, a repository with id central
      # in the project raeva.toml puts Central first.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21" # a JDK listed in [lock] jdks, or the JDK the lock was written with
          server-id: company-releases
          server-username-env-var: REPO_USER
          server-password-env-var: REPO_TOKEN
          settings-path: ${{ runner.temp }}
      - uses: raeva-io/setup-raeva@531ed34d5b24d6a07f3ed9b904fc5d69dba80d12 # v1.0.1
        with:
          version: 0.5.2
          check: true
          cache: false
          settings: ${{ runner.temp }}/settings.xml
      - run: mvn --batch-mode -s "$RUNNER_TEMP/settings.xml" verify

  fork:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raeva-io/setup-raeva@531ed34d5b24d6a07f3ed9b904fc5d69dba80d12 # v1.0.1
        with:
          version: 0.5.2
          cache: false
          lock-diff: only
