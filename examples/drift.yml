# .github/workflows/raeva-drift.yml: ask what a refresh would change, for a
# project with SNAPSHOT or version range dependencies. The job resolves
# again with `raeva sync --update`, as `mvn -U` does, in its own checkout,
# and fails when the result differs from the committed lock: a new SNAPSHOT
# build, a new version in a range, or a republished POM.
#
# `sync --frozen` is not this check: it restores the pinned SNAPSHOT builds
# and does not look for newer ones.
name: Dependency drift

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21" # a JDK listed in [lock] jdks, or the JDK the lock was written with
      - uses: raeva-io/setup-raeva@f944e5a93055fee7320fbbb9026b1e4fe7ee4df7 # v1.0.0
        with:
          version: 0.5.0
          cache: false
      - name: Resolve again and compare
        run: |
          committed="$RUNNER_TEMP/committed.lock"
          cp raeva.lock "$committed"
          raeva sync --update
          raeva --json lock diff "$committed" raeva.lock > "$RUNNER_TEMP/drift.json"
          {
            echo '### Dependency drift'
            echo '````text'
            raeva lock diff "$committed" raeva.lock
            echo '````'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e '.data.changed == false' "$RUNNER_TEMP/drift.json" > /dev/null
