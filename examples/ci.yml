# .github/workflows/ci.yml: your Maven build as it is, plus a job that
# checks raeva.lock. Nothing in the build changes; add enforce.yml later to
# build from the locked artifacts.
name: CI

on:
  push:
    branches: [main] # your default branch: only its pushes save the raeva cache
  pull_request:
  # A required check must also run in a merge queue.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode verify

  raeva:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # raeva evaluates POM profiles with this JDK, so a profile that tests
      # the JDK version gives the same lock only on a JDK the lock covers.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21" # a JDK listed in [lock] jdks, or the JDK the lock was written with
      # Reports lock changes for every recorded platform. Remove check-mode
      # when you want lock changes to fail the job. Other check errors fail.
      - uses: raeva-io/setup-raeva@v1.0.0
        with:
          version: 0.5.0
          check: true
          check-mode: report-only
