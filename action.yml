name: Set up Raeva
description: Install a pinned and verified raeva, cache its artifact store, and optionally check raeva.lock and scan it for vulnerabilities.
author: raeva-io
branding:
  icon: lock
  color: blue

inputs:
  version:
    description: >-
      The raeva version to install, such as 0.5.0. Use an exact version so a
      CLI upgrade is a reviewed change; 'latest' resolves the newest release
      at run time.
    required: true
  verify:
    description: >-
      'attestation' checks the SHA-256 and the GitHub build attestation of
      the release archive with the GitHub CLI. 'sha256' checks the SHA-256
      only, for runners without gh. There is no option to skip verification.
    default: attestation
  token:
    description: >-
      Read token for the attestations, for the release download when the
      repository is private, and, with lock-diff, for the base commit's
      raeva.lock (contents: read). It needs no write scope.
    default: ${{ github.token }}
  cache:
    description: >-
      Restore and save the raeva artifact store and metadata cache, keyed by
      raeva.lock. The store holds every locked jar, private ones included,
      and pull requests from forks can restore the base branch's cache; see
      the README before caching private artifacts in a public repository.
    default: "true"
  working-directory:
    description: The directory that holds the root pom.xml and raeva.lock, relative to the workspace.
    default: "."
  check:
    description: Run `raeva sync --frozen` after the install.
    default: "false"
  platforms:
    description: >-
      Platforms for the frozen check, comma separated (linux-x86_64,
      macos-aarch64). Empty checks the runner's own platform.
    default: ""
  settings:
    description: >-
      A Maven settings file for raeva to read in place of ~/.m2/settings.xml,
      relative to the workspace, passed as -s, as for mvn -s.
    default: ""
  profiles:
    description: >-
      Maven profile ids to activate, comma separated, with !id to deactivate
      one, passed as -P, as for mvn -P.
    default: ""
  properties:
    description: >-
      Maven user properties, one name=value per line, each passed as -D, as
      for mvn -D. Whitespace around a line is dropped.
    default: ""
  relock:
    description: >-
      Run `raeva sync` for every platform the lock records (or the platforms
      input), for a workflow that commits the result. Linux and macOS only.
      The action never commits or pushes.
    default: "false"
  lock-diff:
    description: >-
      With check, on a pull request, write the semantic diff between the base
      commit's raeva.lock and this one to the job summary. 'only' writes the
      diff and skips check and vuln, for a job without credentials, such as
      one for pull requests from forks. Linux and macOS.
    default: "true"
  vuln:
    description: Run `raeva vuln --format sarif` after the frozen check.
    default: "false"
  vuln-fail-on:
    description: >-
      Fail the job on findings at or above this severity: any, low, medium,
      high, critical, or never. Unknown severity meets every threshold.
    default: high
  vex:
    description: >-
      OpenVEX files for the scan, one path per line, relative to the
      workspace. raeva suppresses the findings they mark not_affected; the
      SARIF log keeps them as suppressed results, which neither count as
      findings nor fail the job.
    default: ""
  sarif-upload:
    description: >-
      Upload the SARIF log to GitHub code scanning. The job needs
      security-events: write. Private repositories need GitHub Code Security.
    default: "true"
  sarif-category:
    description: >-
      The code scanning category. Empty means raeva for the repository root
      and raeva/<working-directory> otherwise, so the alerts of several Maven
      roots do not replace each other.
    default: ""
  rv-alias:
    description: Also install the binary as `rv`. In PowerShell, `rv` is an alias of Remove-Variable; call rv.exe there.
    default: "false"
  repository:
    description: The GitHub repository that publishes raeva releases.
    default: raeva-io/raeva
  download-base-url:
    description: >-
      Download from this URL instead of the GitHub release, for a mirror. It
      must serve sha256.sum and the archives. Attestations are still checked
      against the repository input.
    default: ""

outputs:
  version:
    description: The installed version.
    value: ${{ steps.unix.outputs.version || steps.windows.outputs.version }}
  bin-dir:
    description: The directory added to PATH.
    value: ${{ steps.unix.outputs.bin-dir || steps.windows.outputs.bin-dir }}
  raeva:
    description: The full path of the raeva binary.
    value: ${{ steps.unix.outputs.raeva || steps.windows.outputs.raeva }}
  relocked-platforms:
    description: The platforms that relock passed to raeva sync.
    value: ${{ steps.relock.outputs.relocked-platforms }}
  cache-hit:
    description: true when the store was restored for this exact lock file.
    value: ${{ steps.cache.outputs.cache-hit }}
  frozen-exit-code:
    description: The exit code of `raeva sync --frozen`, when check ran.
    value: ${{ steps.scan-unix.outputs.frozen-exit-code || steps.scan-windows.outputs.frozen-exit-code }}
  sarif-file:
    description: >-
      The path of the SARIF log, when vuln ran and wrote one. An incomplete
      scan keeps its partial log, and the job still fails.
    value: ${{ steps.scan-unix.outputs.sarif-file || steps.scan-windows.outputs.sarif-file }}
  sarif-category:
    description: The code scanning category of the SARIF upload.
    value: ${{ steps.scan-unix.outputs.sarif-category || steps.scan-windows.outputs.sarif-category }}
  vuln-findings:
    description: The number of results in the SARIF log that no VEX statement suppressed.
    value: ${{ steps.scan-unix.outputs.vuln-findings || steps.scan-windows.outputs.vuln-findings }}

runs:
  using: composite
  steps:
    - id: unix
      if: runner.os != 'Windows'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/install.sh"'
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_VERIFY: ${{ inputs.verify }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_DOWNLOAD_BASE_URL: ${{ inputs.download-base-url }}
        INPUT_RV_ALIAS: ${{ inputs.rv-alias }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        GH_TOKEN: ${{ inputs.token }}

    # The default pwsh shell (-command ". '{0}'") reports every failure as
    # exit code 1. With -File, the step keeps raeva's exit code.
    - id: windows
      if: runner.os == 'Windows'
      shell: pwsh -NoLogo -NoProfile -NonInteractive -File {0}
      run: '& "$env:GITHUB_ACTION_PATH/scripts/install.ps1"; exit $LASTEXITCODE'
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_VERIFY: ${{ inputs.verify }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_DOWNLOAD_BASE_URL: ${{ inputs.download-base-url }}
        INPUT_RV_ALIAS: ${{ inputs.rv-alias }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        GH_TOKEN: ${{ inputs.token }}

    # The cache is saved at the end of the job. A pull request can read the
    # base branch's cache but writes only to its own scope, and raeva
    # re-hashes each stored file against its pin before export-m2 uses it.
    - id: cache
      if: inputs.cache == 'true' && (steps.unix.outputs.cache-key || steps.windows.outputs.cache-key)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.unix.outputs.cache-paths || steps.windows.outputs.cache-paths }}
        key: ${{ steps.unix.outputs.cache-key || steps.windows.outputs.cache-key }}
        restore-keys: ${{ steps.unix.outputs.cache-restore-key || steps.windows.outputs.cache-restore-key }}

    - id: relock
      if: inputs.relock == 'true'
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Windows ]; then
          echo "::error title=setup-raeva::relock runs on Linux and macOS runners"
          exit 1
        fi
        "$GITHUB_ACTION_PATH/scripts/check.sh" relock
      env:
        RAEVA_BIN: ${{ steps.unix.outputs.raeva }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_PLATFORMS: ${{ inputs.platforms }}
        INPUT_SETTINGS: ${{ inputs.settings }}
        INPUT_PROFILES: ${{ inputs.profiles }}
        INPUT_PROPERTIES: ${{ inputs.properties }}

    - id: scan-unix
      if: runner.os != 'Windows' && (inputs.check == 'true' || inputs.vuln == 'true' || inputs.lock-diff == 'only')
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/check.sh" scan'
      env:
        RAEVA_BIN: ${{ steps.unix.outputs.raeva }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_CHECK: ${{ inputs.check }}
        INPUT_PLATFORMS: ${{ inputs.platforms }}
        INPUT_VULN: ${{ inputs.vuln }}
        INPUT_VULN_FAIL_ON: ${{ inputs.vuln-fail-on }}
        INPUT_VEX: ${{ inputs.vex }}
        INPUT_SARIF_CATEGORY: ${{ inputs.sarif-category }}
        INPUT_LOCK_DIFF: ${{ inputs.lock-diff }}
        INPUT_SETTINGS: ${{ inputs.settings }}
        INPUT_PROFILES: ${{ inputs.profiles }}
        INPUT_PROPERTIES: ${{ inputs.properties }}
        GH_TOKEN: ${{ inputs.token }}

    - id: scan-windows
      if: runner.os == 'Windows' && (inputs.check == 'true' || inputs.vuln == 'true')
      shell: pwsh -NoLogo -NoProfile -NonInteractive -File {0}
      run: '& "$env:GITHUB_ACTION_PATH/scripts/check.ps1" scan; exit $LASTEXITCODE'
      env:
        RAEVA_BIN: ${{ steps.windows.outputs.raeva }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_CHECK: ${{ inputs.check }}
        INPUT_PLATFORMS: ${{ inputs.platforms }}
        INPUT_VULN: ${{ inputs.vuln }}
        INPUT_VULN_FAIL_ON: ${{ inputs.vuln-fail-on }}
        INPUT_VEX: ${{ inputs.vex }}
        INPUT_SARIF_CATEGORY: ${{ inputs.sarif-category }}
        INPUT_SETTINGS: ${{ inputs.settings }}
        INPUT_PROFILES: ${{ inputs.profiles }}
        INPUT_PROPERTIES: ${{ inputs.properties }}

    # A push by Dependabot runs with a read-only token and the upload is
    # refused, so a failed upload warns instead of failing the job.
    - if: inputs.vuln == 'true' && inputs.sarif-upload == 'true' && (steps.scan-unix.outputs.sarif-file || steps.scan-windows.outputs.sarif-file)
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        sarif_file: ${{ steps.scan-unix.outputs.sarif-file || steps.scan-windows.outputs.sarif-file }}
        category: ${{ steps.scan-unix.outputs.sarif-category || steps.scan-windows.outputs.sarif-category }}

    - if: inputs.vuln == 'true' && runner.os != 'Windows'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/check.sh" gate'
      env:
        VULN_EXIT_CODE: ${{ steps.scan-unix.outputs.vuln-exit-code }}
        INPUT_VULN_FAIL_ON: ${{ inputs.vuln-fail-on }}

    - if: inputs.vuln == 'true' && runner.os == 'Windows'
      shell: pwsh -NoLogo -NoProfile -NonInteractive -File {0}
      run: '& "$env:GITHUB_ACTION_PATH/scripts/check.ps1" gate; exit $LASTEXITCODE'
      env:
        VULN_EXIT_CODE: ${{ steps.scan-windows.outputs.vuln-exit-code }}
        INPUT_VULN_FAIL_ON: ${{ inputs.vuln-fail-on }}
